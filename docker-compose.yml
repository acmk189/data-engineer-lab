name: data-engineer-lab

services:
  # JupyterLab + PySpark。ノートブックはここで動かす
  lab:
    build: ./docker/lab
    ports:
      - "127.0.0.1:8888:8888"             # JupyterLab
      - "127.0.0.1:4040-4043:4040-4043"   # Spark UI（ノートブックを同時に開くと 4041, 4042 … と増える）
    volumes:
      - .:/workspace
    environment:
      LAB_DRIVER_MEMORY: ${LAB_DRIVER_MEMORY:-3g}   # Spark に使わせるメモリ。足りなければ .env で増やす
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      TZ: Asia/Tokyo
    depends_on:
      - mysql

  # SQL の問題を解く相手。初回起動時に docker/mysql/init/ の SQL が流れ、data/seed/ の CSV が読み込まれる
  mysql:
    image: mysql:8.4
    # local-infile は、初回起動時に CSV を読み込む（LOAD DATA LOCAL INFILE）ために有効にしている
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--local-infile=1"]
    ports:
      - "127.0.0.1:${LAB_MYSQL_HOST_PORT:-3307}:3306"   # ホストから繋ぐときは localhost:3307（手元の MySQL とぶつからないように 3306 を避けている）
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./data/seed:/opt/lab/seed:ro
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: lab
      TZ: Asia/Tokyo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulab", "-plab"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
