# MySQL DBA 学習トラックの実験環境。ルートの docker-compose.yml とは別のプロジェクトとして動く。
# 使い方は README.md と `make` の一覧を見る。
name: mysql-dba

x-healthcheck: &healthcheck
  test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
  interval: 2s
  timeout: 3s
  retries: 90

services:
  # ソース。binlog ON、GTID ON。初回起動時に、ルートのスキーマとシード（data/seed/）を読み込む
  src:
    image: mysql:8.4.13
    ports:
      - "127.0.0.1:${MYSQL_DBA_SRC_PORT:-3311}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lab
      MYSQL_INITDB_SKIP_TZINFO: "1"
      TZ: Asia/Tokyo
    volumes:
      - src-data:/var/lib/mysql
      - ./docker/mysql/common.cnf:/etc/mysql/conf.d/00-common.cnf:ro
      - ./docker/mysql/src.cnf:/etc/mysql/conf.d/10-server.cnf:ro
      - ../docker/mysql/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../docker/mysql/init/02_load.sh:/docker-entrypoint-initdb.d/02_load.sh:ro
      - ./docker/init/10_users.sql:/docker-entrypoint-initdb.d/10_users.sql:ro
      - ../data/seed:/opt/lab/seed:ro
    healthcheck: *healthcheck

  # レプリカ。空から始めて、src の binlog を全部流し込む（初期データは自分では読み込まない）
  rep:
    image: mysql:8.4.13
    ports:
      - "127.0.0.1:${MYSQL_DBA_REP_PORT:-3312}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_INITDB_SKIP_TZINFO: "1"
      TZ: Asia/Tokyo
    volumes:
      - rep-data:/var/lib/mysql
      - ./docker/mysql/common.cnf:/etc/mysql/conf.d/00-common.cnf:ro
      - ./docker/mysql/rep.cnf:/etc/mysql/conf.d/10-server.cnf:ro
      - ./docker/init/90_replica.sql:/docker-entrypoint-initdb.d/90_replica.sql:ro
    healthcheck: *healthcheck

  # binlog を OFF にしたサーバー（20章）。make nobin-up で立てて、make nobin-down で止める。中身は空
  nobin:
    image: mysql:8.4.13
    profiles: ["nobin"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_INITDB_SKIP_TZINFO: "1"
      TZ: Asia/Tokyo
    volumes:
      - nobin-data:/var/lib/mysql
      - ./docker/mysql/common.cnf:/etc/mysql/conf.d/00-common.cnf:ro
      - ./docker/mysql/nobin.cnf:/etc/mysql/conf.d/10-server.cnf:ro
    healthcheck: *healthcheck

  # 32章の移行元。8.0 で、src と同じ初期データを読み込む。make bg-up で立てて、make bg-down で消す
  blue:
    image: mysql:8.0.46
    profiles: ["bg"]
    ports:
      - "127.0.0.1:${MYSQL_DBA_BLUE_PORT:-3313}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lab
      MYSQL_INITDB_SKIP_TZINFO: "1"
      TZ: Asia/Tokyo
    volumes:
      - blue-data:/var/lib/mysql
      - ./docker/mysql/common.cnf:/etc/mysql/conf.d/00-common.cnf:ro
      - ./docker/mysql/blue.cnf:/etc/mysql/conf.d/10-server.cnf:ro
      - ../docker/mysql/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../docker/mysql/init/02_load.sh:/docker-entrypoint-initdb.d/02_load.sh:ro
      - ./docker/init/10_users.sql:/docker-entrypoint-initdb.d/10_users.sql:ro
      - ../data/seed:/opt/lab/seed:ro
    healthcheck: *healthcheck

  # 32章の移行先。8.4 で、最初は空。blue のレプリカにしてから切り替える。
  # 8.4 では mysql_native_password が既定で使えない。make bg-up native=ON で、使えるようにして起動し直す
  green:
    image: mysql:8.4.13
    profiles: ["bg"]
    command: ["--mysql-native-password=${GREEN_NATIVE_PASSWORD:-OFF}"]
    ports:
      - "127.0.0.1:${MYSQL_DBA_GREEN_PORT:-3314}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_INITDB_SKIP_TZINFO: "1"
      TZ: Asia/Tokyo
    volumes:
      - green-data:/var/lib/mysql
      - ./docker/mysql/common.cnf:/etc/mysql/conf.d/00-common.cnf:ro
      - ./docker/mysql/green.cnf:/etc/mysql/conf.d/10-server.cnf:ro
      - ./docker/init/90_replica.sql:/docker-entrypoint-initdb.d/90_replica.sql:ro
    healthcheck: *healthcheck

  # 42章の Kafka（KRaft の1台構成）。make cdc-up で立てて、make cdc-down で消す。データは残さない。メモリを絞ってある
  kafka:
    image: apache/kafka:4.1.1
    profiles: ["cdc"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 2s
      timeout: 3s
      retries: 60

  # 42章の Kafka Connect（分散モード）と、Debezium の MySQL コネクター。イメージは docker/connect から作る
  connect:
    build: ./docker/connect
    image: mysql-dba-connect:local
    profiles: ["cdc"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/"]
      interval: 3s
      timeout: 3s
      retries: 60

  # 道具のコンテナ（mysql、mysqlbinlog、mysqlslap、sysbench、python）。全部のサーバーにここから繋ぐ。
  # src と rep のデータディレクトリを読み取り専用で見られる（binlog や redo のファイルを直接見るため）。
  # リポジトリ全体も読み取り専用で /repo に見せる（make lint が、mysql-dba/ の外へのリンクを確かめるため）
  tools:
    build: ./docker/tools
    image: mysql-dba-tools:local
    volumes:
      - .:/lab
      - ..:/repo:ro
      - src-data:/var/lib/mysql-src:ro
      - rep-data:/var/lib/mysql-rep:ro
    environment:
      PYTHONPATH: /lab/labs/common
      TZ: Asia/Tokyo

volumes:
  src-data:
  rep-data:
  nobin-data:
  blue-data:
  green-data:
